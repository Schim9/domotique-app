<div class="keen-slider__slide card-carrousel-item">
  <div class="card-header">{{element().title}}</div>
  <div class="card-content">
    <div class="image-container-switch">
      <img [src]="defineIcon()" alt="selector">
      @if (isIrrigationOn() && remainingTime()) {
        <span class="remaining-badge">{{ remainingTime() }}</span>
      }
    </div>
    <div class="level-buttons">
      @for (opt of selector().options; track opt.level) {
        <button
          class="level-btn"
          [class.active]="opt.level === selector().level"
          (click)="handleChange(opt.level)">
          {{opt.label}}
        </button>
      }
    </div>
    <div class="image-with-data">
      <img src="./assets/temperature/update.png" alt="Last seen">
      <p>{{defineLastTime()}}</p>
    </div>
  </div>
</div>
